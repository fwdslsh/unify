[install]
# Prefer exact versions for stability
save-exact = true
registry = "https://registry.npmjs.org/"

[test]
# Use Bun's test runner
timeout = 5000 # timeout in milliseconds (example: 5000ms = 5s)
# Loaded before the runner touches a test file, in this order: tests/watchdog.mjs
# bounds the whole run, tests/preflight.mjs refuses to start on a tree that does
# not parse (docs/testing-strategy.md §5/§8). Under [test], so `bun src/cli.js`
# never sees them.
preload = ["./tests/watchdog.mjs", "./tests/preflight.mjs", "./tests/tmp-reaper.mjs"]

[run]
# Enable Bun's built-in bundler for imports
bun = true

