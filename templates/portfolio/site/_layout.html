<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>— My Portfolio</title>
    <!-- relative, not /assets/…: open this file straight from the folder and
         the styles apply; unify rewrites it for every page at every depth. -->
    <link rel="stylesheet" href="assets/style.css">
    <!-- theme: the site's values for the stylesheet's custom properties, from
         site/_includes/theme.html — copy site/_examples/theme.html there — or,
         until it exists, the template's own _includes/theme.html beside
         AGENTS.md: the project root is the last place an include resolves from. -->
    <include src="/_includes/theme.html"></include>
    <!-- share card: assets/share-placeholder.png is a PLACEHOLDER, a flat
         1200×630 image. Replace the file, and correct these two numbers
         if yours is a different size — they must match it (see DEPLOY.md). -->
    <meta property="og:type" content="website">
    <meta property="og:image" content="/assets/share-placeholder.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <!-- schema: unify writes each page's JSON-LD from what that page itself
         declares. Delete this line and none is written; write your own
         <script type="application/ld+json"> and yours wins. -->
    <meta name="schema" content="WebPage">
  </head>
  <body>
    <include src="/_includes/nav.html"></include>
    <!-- main: everything a page did not address to a named slot -->
    <main><slot></slot></main>
    <footer class="site-footer">
      <!-- footer: the site byline, or whatever a page puts here instead -->
      <slot name="footer"><p>© My Portfolio</p></slot>
    </footer>
  </body>
</html>
