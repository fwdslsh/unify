name: Deploy docs

# Publishes examples/unify-docs — unify's own documentation site, built by
# unify from the repository's real docs/ directory (issue #51) — to GitHub
# Pages, together with live copies of five other examples assembled under
# its dist/examples/<name>/ (see "Assemble example galleries" below, which
# is what the site's own /examples/ gallery page links to at runtime).
# --generate reads ../../../docs relative to the example's source root, so
# this always renders whatever is on the branch being deployed; nothing
# here copies content.
#
# Requires a one-time repository setting this workflow cannot make for
# itself: Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions". Until that is set, the deploy job fails with a clear
# "Pages site not found" error rather than doing nothing silently.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      # Covers examples/unify-docs/** (the site itself) too: the deploy
      # assembles five other examples' own trees into the published gallery
      # (see the "Assemble example galleries" steps below), so an edit
      # anywhere under examples/ can change what ships and must redeploy it.
      - "examples/**"
      # The site extends the docs template in place (examples/unify-docs/unify.yaml),
      # so a template change is a change to every page of this site.
      - "templates/docs/**"
      - ".github/workflows/deploy-docs.yml"
      # The site is rendered BY src/ as much as FROM docs/: an engine change
      # can alter every emitted page with no docs/ edit at all. v0.8.3 proved
      # it — enabling Markdown tables (src/core/markdown.js) turned 247 rows
      # of literal pipe text into 27 real <table> elements, and only reached
      # the live site because that release's merges happened to touch docs/
      # too. A src-only rendering fix would have left the site stale until
      # someone remembered the manual dispatch.
      - "src/**"
  workflow_dispatch:

# The custom domain: unify.fwdslsh.dev, DNS-verified and set as this repo's
# Pages custom domain in Settings -> Pages. No CNAME file is added to the
# build output for this — GitHub Actions deployments ignore one if present;
# the domain lives entirely in the repository setting, which is also what
# provisions the certificate. (The prior address, before the domain was
# wired up, was the default project-pages URL, fwdslsh.github.io/unify/ —
# kept working, still resolves, GitHub will redirect it to this one.)
env:
  SITE_BASE_URL: https://unify.fwdslsh.dev/

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment in flight; a newer push wins over a stale one still
# building, but never cancels a deployment already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The pre-publish gate, same discipline as any other unify site: the
      # whole build and every check writing nothing, then the completeness
      # audit — both --strict, both must exit 0 before anything is published.
      # The site's flags live in examples/unify-docs/unify.yaml (0.10's
      # project-root layout: site/, scripts/gen.mjs, unify.yaml); only the
      # address is overridden here, and only so a fork deploys to its own.
      - name: Verify — build --dry-run --strict
        run: |
          cd examples/unify-docs
          bun ../../src/cli.js build --base-url "$SITE_BASE_URL" --dry-run --strict
      - name: Verify — audit --strict
        run: |
          cd examples/unify-docs
          bun ../../src/cli.js audit --base-url "$SITE_BASE_URL" --strict

      - name: Build
        run: |
          cd examples/unify-docs
          bun ../../src/cli.js build --base-url "$SITE_BASE_URL" --clean --strict

      # --- Assemble example galleries -----------------------------------
      #
      # The seam: the docs site above owns examples/unify-docs/dist/ end to
      # end (it wrote --clean, so this always starts from that site's own
      # fresh publish); each step below owns exactly one subdirectory under
      # examples/unify-docs/dist/examples/, built as a wholly separate unify
      # project with the CHECKOUT'S OWN CLI (bun src/cli.js), not the docs
      # site's build. Nothing here edits an already-emitted page — each
      # example is unify's ordinary transactional publish, just addressed at
      # a --base-url subpath and aimed at a directory nested inside the
      # artifact this job uploads. Order matters: this runs after the docs
      # site's own --clean (above), so that build never deletes what we
      # assemble here, and before the Pages artifact upload (below).
      #
      # Why the gallery page never gets a plain href="/examples/<name>/":
      # a link like that would be checked by this build's own §12 reference
      # check, which has no way to see a tree assembled here, after the
      # site's own publish — so it would be a located problem (P13) on every
      # build. examples/unify-docs/src/examples/index.html resolves each
      # "View live" address in a small inline script instead (the client-
      # side URL seam _notes/batches/b10-contract.md's Part 1 implements),
      # which is why five plain directories appearing here, with no page in
      # examples/unify-docs/src/ ever linking to them, is correct rather
      # than an oversight.
      #
      # Each example builds FROM ITS OWN DIRECTORY with the flags its
      # unify.yaml saves — the same `cd examples/<name> && unify build` its
      # README or AUTHORS-NOTES documents — against the checkout's CLI, with
      # -o pointed at this assembly's path and --base-url overridden to this
      # deploy's real subpath (the file's own base-url is the address the
      # example documents for itself). htmx-fragments has no unify.yaml: it
      # documents no build flags anywhere (it is hand-maintained, not
      # sandbox-authored like the others) and its hx-get targets are
      # deliberately page-relative — a flat, non-pretty layout is what makes
      # that addressing scheme work at any deploy depth (see
      # examples/README.md's "patterns worth copying") — so it gets no
      # --pretty-urls here, matching what it actually documents: nothing
      # beyond a plain build.
      - name: Assemble examples
        run: |
          set -euo pipefail
          for ex in seed-library seed-library-alt seed-library-ondemand htmx-fragments catalog-search-blog; do
            echo "── $ex"
            (cd "examples/$ex" && bun ../../src/cli.js build -o "../unify-docs/dist/examples/$ex" \
              --base-url "$SITE_BASE_URL"examples/$ex/ --clean --dry-run --strict)
            (cd "examples/$ex" && bun ../../src/cli.js build -o "../unify-docs/dist/examples/$ex" \
              --base-url "$SITE_BASE_URL"examples/$ex/ --clean --strict)
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/unify-docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
