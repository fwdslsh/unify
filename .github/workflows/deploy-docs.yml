name: Deploy docs

# One content tree: docs corrections publish independently of runtime releases.
# check-docs installs docs/.runtime-version from npm, verifies the examples,
# then builds this site and its five galleries with that same released CLI.
# Requires Settings > Pages > Source = GitHub Actions.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "examples/**"
      - "templates/docs/**"
      - "scripts/check-docs.mjs"
      - "tests/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

# The custom domain: unify.fwdslsh.dev, DNS-verified and set as this repo's
# Pages custom domain in Settings -> Pages. No CNAME file is added to the
# build output for this — GitHub Actions deployments ignore one if present;
# the domain lives entirely in the repository setting, which is also what
# provisions the certificate. (The prior address, before the domain was
# wired up, was the default project-pages URL, fwdslsh.github.io/unify/ —
# kept working, still resolves, GitHub will redirect it to this one.)
env:
  SITE_BASE_URL: https://unify.fwdslsh.dev/

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment in flight; a newer push wins over a stale one still
# building, but never cancels a deployment already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify documentation and build with the declared released CLI
        run: bun scripts/check-docs.mjs --build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/unify-docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
