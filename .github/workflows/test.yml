name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # The runtime signal (docs/migration-plan.md §1). Two assertions, both
  # blocking, because a job that cannot fail is not a signal.
  #
  #  1. The gap set computed from rules a test actually RAN and PASSED equals
  #     the committed phase baseline exactly — a new uncovered rule fails, and
  #     a gap that closed fails until the baseline shrinks in the same commit.
  #     This is what closes the skipped-test hole: a test.skip records nothing.
  #
  #  2. The DECLARED PHASE matches reality. The release condition is the same
  #     check with no --baseline, so it must fail while the baseline is
  #     non-empty and pass once it is empty. Asserting the correspondence keeps
  #     this job red exactly when the two diverge, and turns it into the release
  #     gate automatically the moment the baseline empties — no second job, no
  #     continue-on-error, nothing anyone is trained to ignore.
  #
  # An earlier attempt used a separate continue-on-error job for the release
  # semantics. It was worse than useless: GitHub reports such a job's
  # conclusion as SUCCESS, so it read green in the checks list and its only
  # output was log text nobody opens.
  #
  # This job checked the release condition directly until the manifest work
  # opened §20's rows. A spec section can be written before any CLI surface
  # exists to observe it, and the honest record of that is a baseline entry —
  # not a red people are told to ignore, which is the "warn instead of fail"
  # mechanism docs/testing-strategy.md §1 (M2) blames for the suite this one
  # replaced. release.yml runs the unbaselined check BLOCKING at tag time, so a
  # phase-baselined tree can never be released.
  #
  # Do not "fix" this job by weakening the harness or the checker.
  release-signal:
    name: Runtime traceability (coverage + declared phase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Full suite + runtime traceability
        # The legacy test tree is gone, so this is a bare
        # `bun test` again — there is no longer a quarantined tree to filter
        # out, and every test in the repo votes.
        run: |
          rm -f .conformance-ledger.jsonl
          bun test
          bun tests/conformance/check-traceability.mjs --runtime .conformance-ledger.jsonl --baseline tests/conformance/phase-gaps/baseline.txt
      - name: Declared phase matches reality
        run: |
          set -u
          baseline=tests/conformance/phase-gaps/baseline.txt
          if [ -s "$baseline" ]; then
            echo "Phase baseline is non-empty; the release gate must still be red:"
            sed 's/^/  /' "$baseline"
            if bun tests/conformance/check-traceability.mjs --runtime .conformance-ledger.jsonl; then
              echo "::error::Release gate PASSES but the phase baseline is non-empty — empty $baseline in this commit."
              exit 1
            fi
            echo "OK: release gate red, as the declared phase says it should be."
          else
            echo "Phase baseline is empty; the release gate must now be green."
            bun tests/conformance/check-traceability.mjs --runtime .conformance-ledger.jsonl
          fi

  # Always-on gate G8: every src/** file reachable from src/cli.js. A module
  # nothing imports is either a cut feature left behind or a written-and-never-
  # wired one, and a green suite sees neither — a unit test importing a module
  # directly makes it covered without making it reachable.
  module-graph:
    name: No dead modules (G8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun tests/conformance/check-module-graph.mjs

  # Always-on gate G9: the anti-rot rules for the suite itself (H1-H5).
  suite-hygiene:
    name: Suite hygiene (G9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun tests/conformance/check-suite-hygiene.mjs

  # Always-on: spec-to-inventory sync plus static rule coverage. Green during
  # the migration iff the gap list equals the committed phase baseline: a new
  # uncovered rule fails, and a closed gap fails until the baseline shrinks
  # in the same commit.
  traceability-static:
    name: Traceability (static vs phase-gaps baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun tests/conformance/check-traceability.mjs --static --baseline tests/conformance/phase-gaps/baseline.txt

  # Always-on gate G13: every example still builds. `examples/` holds seven
  # sites and CI used to build one, so an example could stop working and
  # nothing would notice — which is not hypothetical: a deploy workflow
  # carried `--copy` for three releases after that flag was cut, and the
  # eleventy-htmx example shipped a first draft whose production script was
  # named `publish`, not `build`. Both were caught by a person looking, which
  # is not a control.
  #
  # They are also load-bearing rather than decorative: examples/README.md
  # cites four of them as the evidence that docs/authoring-rules.md is
  # sufficient to author from. Evidence that silently stops building is worse
  # than none, because it is still being cited.
  #
  # `build --dry-run --strict` is the gate for ALL of them; `audit --strict`
  # only for the two that already meet it. The four sandbox-authored sites
  # carry 41 `incomplete` findings between them (share images with no
  # declared dimensions, mostly), and they always have — demanding audit
  # cleanliness here would be a new requirement wearing a regression gate's
  # clothes, and it would land this job red on the day it merged.
  examples:
    name: Examples build (G13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Dependency-free examples
        run: |
          set -euo pipefail
          for ex in seed-library seed-library-alt seed-library-ondemand htmx-fragments; do
            echo "── $ex"
            bun src/cli.js build -s "examples/$ex/src" -o "/tmp/$ex" --dry-run --strict
          done
      - name: unify-docs (build and audit, as deploy-docs.yml gates it)
        run: |
          set -euo pipefail
          bun src/cli.js build -s examples/unify-docs/src -o /tmp/unify-docs \
            --generate _scripts/gen.mjs --pretty-urls \
            --base-url https://unify.fwdslsh.dev/ --canonical auto --catalog --search-corpus \
            --dry-run --strict
          bun src/cli.js audit -s examples/unify-docs/src \
            --generate _scripts/gen.mjs --pretty-urls \
            --base-url https://unify.fwdslsh.dev/ --canonical auto --catalog --search-corpus \
            --strict

  # G13, the half that needs a package install. Deliberately run on NODE:
  # bun auto-installs an import it cannot resolve, so a missing dependency
  # would be fetched from npm mid-build and the gate would pass while a
  # `npx @fwdslsh/unify` user fails on the same tree (issue #75). Running the
  # generator seam under node is what makes this gate mean anything.
  examples-npm:
    name: Examples with dependencies (G13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: forge-svelte
        run: |
          set -euo pipefail
          cd examples/forge-svelte
          npm install
          npm run build:calculator && npm run build:notes
          cd "$GITHUB_WORKSPACE"
          node src/cli.js build -s examples/forge-svelte/src -o /tmp/forge-svelte --dry-run --strict
      - name: eleventy-htmx
        run: |
          set -euo pipefail
          cd examples/eleventy-htmx
          npm ci
          cd "$GITHUB_WORKSPACE"
          node src/cli.js build -s examples/eleventy-htmx/src -o /tmp/eleventy-htmx \
            --generate _scripts/eleventy.mjs --pretty-urls --dry-run --strict
          node src/cli.js audit -s examples/eleventy-htmx/src \
            --generate _scripts/eleventy.mjs --pretty-urls --strict

  # Always-on gate G14: the CHANGELOG has a section for the version in
  # package.json, because the release body IS that section
  # (extract-release-notes.mjs; release.yml composes the body from it). This
  # replaced a hand-maintained release_notes.md that was wrong at both
  # releases that used it while the CHANGELOG was right both times — the
  # failure was never the writing, it was having two of it. This job goes red
  # between bumping the version and writing its section: they are two halves
  # of one change, and the failure message says which half is missing.
  release-notes:
    name: Changelog covers the version (G14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun .github/workflows/extract-release-notes.mjs > /dev/null
