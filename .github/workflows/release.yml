name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  init:
    name: Initialize
    runs-on: ubuntu-latest
    steps:

      - name: Env Check
        run: |
          echo "Release: ${{ github.event.inputs.tag || github.ref_name }}"
        shell: bash

      - name: Checkout code
        uses: actions/checkout@v4

      # The binary build stamps its version from this tag (APP_VERSION, see
      # bun-build-binaries.yml) while `unify --version` reports package.json
      # (src/cli.js). If they disagree, npm publish also fails outright — but
      # only after every binary has already been built and uploaded. Catch it
      # here instead, before anything is built or published.
      - name: Tag must match package.json version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg="v$(jq -r .version package.json)"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag does not match package.json version $pkg — bump package.json or retag"; exit 1; }

  # First, build all binaries
  build:
    name: Build Binaries
    needs: init
    uses: fwdslsh/toolkit/.github/workflows/bun-build-binaries.yml@main
    with:
      upload-artifacts: true

  # Then create the release
  release:
    name: Create Release
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: fwdslsh/toolkit/.github/workflows/create-gh-release.yml@main
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit


  # Call Docker publishing workflow
  docker:
    name: Publish Docker Image
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: fwdslsh/toolkit/.github/workflows/publish-docker.yml@main
    with:
      tag:  ${{ github.event.inputs.tag || github.ref_name }}
      description: Unify is a SSG that provides a minimal tool set to allow developers to build lightweight web sites
    secrets: inherit
  

  # Call NPM publishing workflow
  publish-npm:
    name: Publish NPM Package
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: fwdslsh/toolkit/.github/workflows/publish-npm.yml@main
    secrets: inherit