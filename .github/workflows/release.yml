name: Release

# Everything this workflow does is in this file. It used to delegate to four
# shared workflows in fwdslsh/toolkit; that indirection cost more than it saved
# — the shared release step generated a download table for a different tool
# (catalog-*), and the shared build step ran `bun test || echo skipping`, so a
# red tree could ship. Both are fixed here by being here.
#
# Two ways in, and a prerelease is decided by the version, never by the route:
#   - push a tag `v*` (`v1.2.3`, or `v1.2.3-rc.1` from a release branch)
#   - run it manually from any branch; the tag defaults to package.json's version
# A version with a hyphen (`1.2.3-rc.1`) is a semver prerelease, so the GitHub
# release is marked pre-release, npm publishes under the `next` dist-tag, and
# `docker …:latest` is left pointing at the last stable build.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release — leave blank to use package.json. "1.2.3" and "v1.2.3" both work.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) — this replaces NPM_TOKEN

jobs:
  release:
    name: Verify, build, and publish the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      prerelease: ${{ steps.rel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `unify --version` — compiled binary and npm package alike — reports
      # package.json's version (src/cli.js imports it), so package.json is the
      # single source of truth here and a tag may only agree with it.
      - name: Resolve the release, and check the tag against package.json
        id: rel
        run: |
          version="$(jq -r .version package.json)"
          # What the run was asked for: the pushed tag, or the dispatch input.
          # (On a dispatch, github.ref_name is the branch, so it must not be
          # used as a fallback — an empty input means "use package.json".)
          if [ "${{ github.event_name }}" = "push" ]; then
            asked="${{ github.ref_name }}"
          else
            asked="${{ inputs.tag }}"
          fi
          # Compare versions, not spellings: `v1.2.3-beta.1` and `1.2.3-beta.1`
          # are the same request, and an empty input means package.json's.
          asked="${asked#v}"
          [ -n "$asked" ] || asked="$version"
          if [ "$asked" != "$version" ]; then
            echo "::error::asked to release $asked but package.json says $version — bump package.json, or release the version it already declares"
            exit 1
          fi
          tag="v${version}"
          case "$version" in
            *-*) prerelease=true ;;   # semver prerelease: 1.2.3-rc.1
            *)   prerelease=false ;;
          esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            if [ "$prerelease" = true ]; then echo "npm_tag=next"; else echo "npm_tag=latest"; fi
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from ${GITHUB_REF} (prerelease=$prerelease)"

      # The release gates. A tag can be pushed at any commit, so this is the
      # only thing standing between a red tree and a published release.
      #
      # Traceability runs with RELEASE semantics here — no --baseline, so any
      # uncovered rule fails — even while test.yml's push-time job is baselined
      # for a phase. That asymmetry is the point: a spec section may be
      # written before a CLI surface exists to observe it, but it may not be
      # released that way. Emptying tests/conformance/phase-gaps/baseline.txt is
      # part of shipping, not part of the phase.
      - name: Release gates
        run: |
          rm -f .conformance-ledger.jsonl
          bun test
          bun tests/conformance/check-suite-hygiene.mjs
          bun tests/conformance/check-module-graph.mjs
          bun tests/conformance/check-traceability.mjs --runtime .conformance-ledger.jsonl
          # G14. The release body is CHANGELOG.md's section for this version,
          # extracted below — so the gate is simply that the extraction
          # succeeds. This replaced a hand-maintained release_notes.md that was
          # wrong at both releases that used it (stale at 0.8.2, missing a
          # late change at 0.8.3) while the CHANGELOG was right both times:
          # the failure was never the writing, it was having two of it.
          bun .github/workflows/extract-release-notes.mjs > /dev/null

      # One runner cross-compiles every target, so there is no build matrix.
      # These names are the contract install.sh downloads by ("unify-$os-$arch",
      # detect_platform) — changing one means changing that script too.
      - name: Build binaries
        run: |
          bun build --compile --target=bun-linux-x64     ./src/cli.js --outfile unify-linux-x86_64
          bun build --compile --target=bun-linux-arm64   ./src/cli.js --outfile unify-linux-arm64
          bun build --compile --target=bun-darwin-x64    ./src/cli.js --outfile unify-darwin-x86_64
          bun build --compile --target=bun-darwin-arm64  ./src/cli.js --outfile unify-darwin-arm64
          ls -l unify-*

      # Gate G11: the artifact users download walks the golden path, not just
      # `--version`. Only the runner's own architecture can be executed here.
      - name: Smoke the linux binary
        run: |
          bin="$PWD/unify-linux-x86_64"
          [ "$("$bin" --version)" = "${{ steps.rel.outputs.version }}" ] || { echo "::error::binary reports the wrong version"; exit 1; }
          tmp="$(mktemp -d)"
          cd "$tmp"
          "$bin" init
          "$bin" build --dry-run --strict
          "$bin" build
          [ -f dist/index.html ] || { echo "::error::binary built no index.html"; exit 1; }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash"
            echo '```'
            echo
            echo "Or download a binary below, \`chmod +x\` it, and put it on your PATH."
            if [ "${{ steps.rel.outputs.prerelease }}" = "true" ]; then
              echo "npm: \`npm install -g @fwdslsh/unify@next\` — Bun: \`bun add -g @fwdslsh/unify@next\`"
              echo
              echo "> This is a **pre-release**. \`install.sh\` and \`@fwdslsh/unify\` keep resolving to the latest stable build."
            else
              echo "npm: \`npm install -g @fwdslsh/unify\` — Bun: \`bun add -g @fwdslsh/unify\`"
            fi
            echo
            echo "| Platform | Download |"
            echo "|---|---|"
            for f in unify-linux-x86_64 unify-linux-arm64 unify-darwin-x86_64 unify-darwin-arm64; do
              echo "| \`$f\` | [download](https://github.com/${{ github.repository }}/releases/download/$TAG/$f) |"
            done
            echo
            bun .github/workflows/extract-release-notes.mjs
          } > release-body.md
          pre="${{ steps.rel.outputs.prerelease == 'true' && '--prerelease' || '' }}"
          assets="unify-linux-x86_64 unify-linux-arm64 unify-darwin-x86_64 unify-darwin-arm64"
          # Re-runnable on purpose: publishing APIs are the steps most likely
          # to fail for reasons outside this repo. Re-check state after every
          # failed attempt: a create may have reached GitHub even if its client
          # saw a transient 5xx, and the next pass must update, not duplicate.
          published=false
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG already exists — updating its notes and assets"
              if gh release edit "$TAG" --notes-file release-body.md $pre && \
                 gh release upload "$TAG" $assets --clobber; then
                published=true
                break
              fi
            else
              # --target makes this work when the tag does not exist yet (a
              # manual run from a release branch): the tag is created here.
              if gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
                   --notes-file release-body.md $pre $assets; then
                published=true
                break
              fi
            fi

            if [ "$attempt" -lt 6 ]; then
              delay=$((attempt * 5))
              echo "GitHub release API attempt $attempt failed — retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          [ "$published" = true ] || { echo "::error::failed to create or update $TAG after 6 attempts"; exit 1; }

      # Trusted publishing: npm mints a short-lived credential from this job's
      # OIDC identity, so there is no token to store or rotate. It requires
      # `id-token: write` above, npm >= 11.5.1, and the package configured on
      # npmjs.com with this repository and this workflow filename as a trusted
      # publisher. Provenance is attached automatically.
      - name: Publish to npm
        run: |
          npm install -g npm@latest
          npm --version
          npm publish --access public --tag "${{ steps.rel.outputs.npm_tag }}"

  docker:
    name: Publish the Docker image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require Docker Hub credentials
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$USERNAME" ] && [ -n "$TOKEN" ] || { echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are required"; exit 1; }

      # A prerelease gets its own tag only: `:latest` keeps pointing at the
      # last stable image, so `docker pull fwdslsh/unify` never surprises.
      - name: Image tags
        id: tags
        env:
          TAG: ${{ needs.release.outputs.tag }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          {
            echo 'list<<TAGS_EOF'
            echo "fwdslsh/unify:${TAG}"
            if [ "$PRERELEASE" != "true" ]; then echo "fwdslsh/unify:latest"; fi
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
