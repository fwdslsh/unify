name: Release

# Everything this workflow does is in this file. It used to delegate to four
# shared workflows in fwdslsh/toolkit; that indirection cost more than it saved
# — the shared release step generated a download table for a different tool
# (catalog-*), and the shared build step ran `bun test || echo skipping`, so a
# red tree could ship. Both are fixed here by being here.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.7.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Verify, build, and publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `unify --version` — compiled binary and npm package alike — reports
      # package.json's version (src/cli.js imports it). A tag that disagrees
      # would ship artifacts that self-report a different version, so catch it
      # before anything is built or published.
      - name: Tag must match package.json version
        run: |
          pkg="v$(jq -r .version package.json)"
          [ "$TAG" = "$pkg" ] || { echo "::error::tag $TAG does not match package.json version $pkg — bump package.json or retag"; exit 1; }

      # The release gates, the same commands CI runs on every push. A tag can
      # be pushed at any commit, so this is the only thing standing between a
      # red tree and a published release.
      - name: Release gates
        run: |
          rm -f .conformance-ledger.jsonl
          bun test
          bun tests/conformance/check-suite-hygiene.mjs
          bun tests/conformance/check-traceability.mjs --runtime .conformance-ledger.jsonl

      # One runner cross-compiles every target, so there is no build matrix.
      # These names are the contract install.sh downloads by ("unify-$os-$arch",
      # detect_platform) — changing one means changing that script too.
      - name: Build binaries
        run: |
          bun build --compile --target=bun-linux-x64     ./src/cli.js --outfile unify-linux-x86_64
          bun build --compile --target=bun-linux-arm64   ./src/cli.js --outfile unify-linux-arm64
          bun build --compile --target=bun-darwin-x64    ./src/cli.js --outfile unify-darwin-x86_64
          bun build --compile --target=bun-darwin-arm64  ./src/cli.js --outfile unify-darwin-arm64
          ls -l unify-*

      # Gate G11: the artifact users download walks the golden path, not just
      # `--version`. Only the runner's own architecture can be executed here.
      - name: Smoke the linux binary
        run: |
          bin="$PWD/unify-linux-x86_64"
          [ "$("$bin" --version)" = "$(jq -r .version package.json)" ] || { echo "::error::binary reports the wrong version"; exit 1; }
          tmp="$(mktemp -d)"
          cd "$tmp"
          "$bin" init
          "$bin" build --dry-run --strict
          "$bin" build
          [ -f dist/index.html ] || { echo "::error::binary built no index.html"; exit 1; }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash"
            echo '```'
            echo
            echo "Or download a binary below, \`chmod +x\` it, and put it on your PATH."
            echo "npm: \`npm install -g @fwdslsh/unify\` — Bun: \`bun add -g @fwdslsh/unify\`"
            echo
            echo "| Platform | Download |"
            echo "|---|---|"
            for f in unify-linux-x86_64 unify-linux-arm64 unify-darwin-x86_64 unify-darwin-arm64; do
              echo "| \`$f\` | [download](https://github.com/${{ github.repository }}/releases/download/$TAG/$f) |"
            done
            echo
            cat .github/workflows/release_notes.md
          } > release-body.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-body.md \
            unify-linux-x86_64 unify-linux-arm64 unify-darwin-x86_64 unify-darwin-arm64

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "::error::NPM_TOKEN secret is not set"; exit 1; }
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish --access public

  docker:
    name: Publish the Docker image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Docker Hub credentials
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$USERNAME" ] && [ -n "$TOKEN" ] || { echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are required"; exit 1; }

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            fwdslsh/unify:${{ github.event.inputs.tag || github.ref_name }}
            fwdslsh/unify:latest
